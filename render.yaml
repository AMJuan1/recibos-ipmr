services:
  - type: web
    name: recibos-ipmr
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /admin
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
